name: ci

on:
  push:
  pull_request:

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Style gate
        run: python scripts/style_check.py
      - name: Byte-compile every module
        run: python -m compileall -q vla_cu kernels bench scripts tests
