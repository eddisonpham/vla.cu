name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton pytest numpy ninja
      - name: style
        run: python -m vla_cu style
      - name: task list
        run: python -m vla_cu --help
      - name: tests
        run: python -m pytest -q
